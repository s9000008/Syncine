name: CI/CD - Deploy Syncine Server to Fly.io

# 觸發條件：當 main 分支有更新，且變更範圍包含 server/ 或本 workflow 時自動執行
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/fly-deploy.yml'
  # 支援在 GitHub 網頁上手動單獨觸發部署
  workflow_dispatch:

# 避免多個 commit 同時觸發重疊部署，自動取消排隊中的舊建置
concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # 階段 1: CI 程式碼品質與編譯檢查 (靜態驗證)
  # ==============================================================================
  ci:
    name: CI - TypeCheck & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 檢出原始碼 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 設定 Node.js 26 環境
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安裝相依套件 (Clean Install)
        run: npm ci

      - name: 執行 TypeScript 靜態型別校驗與編譯
        run: npm run build

  # ==============================================================================
  # 階段 2: CD 自動化遠端部署至 Fly.io (鎖定單台、遠端建置、零月費豁免)
  # ==============================================================================
  deploy:
    name: CD - Fly.io Secure Deployment
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: server
    steps:
      - name: 檢出原始碼 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 安裝與設定 Flyctl CLI 工具
        uses: superfly/flyctl-actions/setup-flyctl@master

      # 核心部署指令說明：
      # 1. --remote-only: 透過 Fly.io 雲端遠端 Builder 進行 Multi-stage Docker 建置，安全快速免本地 Docker daemon
      # 2. --ha=false: 強制禁用高可用雙機配置，確保僅運行單一 Machine，鎖定月費在 $0 豁免額度內 (<$5/mo)
      - name: 執行安全部署 (Deploy with Cost-Lock Flags)
        run: flyctl deploy --remote-only --ha=false --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
